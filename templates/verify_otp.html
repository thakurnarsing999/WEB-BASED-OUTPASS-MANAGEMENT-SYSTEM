{% extends "base.html" %}

{% block content %}
<div class="form-box" style="max-width: 480px; margin: 40px auto; text-align: center;">
    <div style="margin-bottom: 25px;">
        <h2 style="margin-bottom: 8px;">Verify Email Address</h2>
        <p style="color: var(--text-muted); font-size: 14px; line-height: 1.5;">
            A 6-digit OTP code has been sent to:<br>
            <strong style="color: #818cf8; font-size: 15px;">{{ pending_email }}</strong>
        </p>
        <p style="color: var(--text-muted); font-size: 12px; margin-top: 8px;">
            Please enter the code below to complete your <strong>{{ pending_role }}</strong> registration.
        </p>
    </div>

    <form method="POST" action="{{ url_for('verify_otp') }}">
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="otpCode" style="font-weight: 600; margin-bottom: 10px; display: block;">6-Digit Security OTP</label>
            <input type="text" name="otp_code" id="otpCode" placeholder="••••••" maxlength="6" pattern="[0-9]{6}" required autocomplete="off" autofocus
                   style="font-size: 26px; letter-spacing: 8px; text-align: center; font-weight: bold; width: 100%; padding: 12px; font-family: monospace;">
        </div>

        <button type="submit" class="btn full" style="margin-bottom: 15px; font-size: 16px;">Verify Email & Complete Registration</button>
    </form>

    <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px;">
        <form method="POST" action="{{ url_for('resend_otp') }}" style="flex: 1;">
            <button type="submit" class="btn secondary full small">Resend Code</button>
        </form>
        <form method="POST" action="{{ url_for('cancel_registration') }}" style="flex: 1;">
            <button type="submit" class="btn danger full small">Cancel</button>
        </form>
    </div>
</div>
{% endblock %}
