{% extends "base.html" %}

{% block content %}

<div class="portal-container" style="padding-top: 16px;">
    <div class="form-box" style="max-width: 540px;">
        <!-- Multi-Color Google Spectrum Accent Beam -->
        <div class="spectrum-bar"></div>

        <!-- Header Section -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border-hairline); padding-bottom: 16px; margin-bottom: 22px;">
            <div>
                <div class="eyebrow-badge">
                    <span class="status-dot"></span>
                    <span>Student Gateway</span>
                </div>
                <h1 style="font-family: var(--font-heading); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary); margin-top: 4px; margin-bottom: 4px;">
                    Apply for Outpass
                </h1>
                <p style="font-size: 13.5px; color: var(--text-secondary);">
                    Submit your request for department faculty review.
                </p>
            </div>
            <a href="{{ url_for('student_dashboard') }}" class="btn small secondary">Back</a>
        </div>

        <form method="POST">
            <!-- Faculty Mentor Selection -->
            <div class="form-group">
                <label>Choose Faculty Mentor to Review</label>
                <select name="mentor_id">
                    <option value="all">-- Any Available Department Mentor --</option>
                    {% for mentor in mentors %}
                        <option value="{{ mentor.mentor_id }}" {% if request.args.get('mentor_id') == mentor.mentor_id|string %}selected{% endif %}>
                            {{ mentor.name }} (Staff ID: {{ mentor.staff_id }})
                        </option>
                    {% endfor %}
                </select>
                <span style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
                    Select the specific mentor you want to review your outpass application.
                </span>
            </div>

            <div class="form-group">
                <label>Reason for Outpass</label>
                <textarea name="reason" rows="3" placeholder="State specific reason (e.g. Medical appointment, family requirement, academic project)" required style="resize: none;"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Exit Date</label>
                    <input type="date" name="out_date" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Exit Time</label>
                    <input type="time" name="out_time" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Parent / Guardian Contact Number</label>
                <input type="tel" name="parent_contact" placeholder="+91 XXXXX XXXXX" required>
            </div>

            <button type="submit" class="btn full">
                <span>Submit Request for Approval</span>
            </button>
        </form>
    </div>
</div>

{% endblock %}
